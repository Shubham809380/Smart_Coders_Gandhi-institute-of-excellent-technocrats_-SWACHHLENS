<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport" />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&amp;display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&ampdisplay=swap" rel="stylesheet" />
    <style>
        @layer base {
            html,
            body {
                width: 100vw;
                margin: 0;
                padding: 0;
                overflow-x: hidden;
            }
            body {
                overscroll-behavior: none;
            }
            .pb-safe {
                padding-bottom: env(safe-area-inset-bottom, 0px);
            }
            .pt-safe {
                padding-top: env(safe-area-inset-top, 0px);
            }
        }
        
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-container": "#fefcff",
                        "on-primary-container": "#f7fff2",
                        "inverse-on-surface": "#eff1f3",
                        "inverse-surface": "#2d3133",
                        "on-surface": "#191c1e",
                        "secondary": "#00687a",
                        "secondary-fixed": "#acedff",
                        "surface-container-high": "#e6e8ea",
                        "on-background": "#191c1e",
                        "on-tertiary-fixed-variant": "#3c475a",
                        "on-tertiary-fixed": "#111c2d",
                        "surface-container": "#eceef0",
                        "tertiary": "#515c71",
                        "surface": "#f7f9fb",
                        "tertiary-fixed-dim": "#bcc7de",
                        "secondary-fixed-dim": "#4cd7f6",
                        "tertiary-container": "#6a758a",
                        "on-error": "#ffffff",
                        "secondary-container": "#57dffe",
                        "surface-bright": "#f7f9fb",
                        "on-secondary-fixed": "#001f26",
                        "outline": "#6e7b6c",
                        "surface-container-highest": "#e0e3e5",
                        "background": "#f7f9fb",
                        "error-container": "#ffdad6",
                        "surface-container-low": "#f2f4f6",
                        "on-secondary-container": "#006172",
                        "primary": "#006b2c",
                        "surface-container-lowest": "#ffffff",
                        "tertiary-fixed": "#d8e3fb",
                        "outline-variant": "#bdcaba",
                        "on-secondary-fixed-variant": "#004e5c",
                        "primary-fixed-dim": "#62df7d",
                        "on-primary-fixed-variant": "#005320",
                        "on-error-container": "#93000a",
                        "surface-dim": "#d8dadc",
                        "on-primary-fixed": "#002109",
                        "surface-variant": "#e0e3e5",
                        "on-tertiary": "#ffffff",
                        "error": "#ba1a1a",
                        "on-primary": "#ffffff",
                        "on-surface-variant": "#3e4a3d",
                        "inverse-primary": "#62df7d",
                        "on-secondary": "#ffffff",
                        "surface-tint": "#006e2d",
                        "primary-fixed": "#7ffc97",
                        "primary-container": "#00873a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "base": "4px",
                        "margin-desktop": "48px",
                        "xxs": "4px",
                        "xl": "32px",
                        "md": "16px",
                        "lg": "24px",
                        "gutter": "16px",
                        "xs": "8px",
                        "sm": "12px",
                        "margin-mobile": "16px"
                    },
                    "fontFamily": {
                        "body-md": ["Manrope"],
                        "label-md": ["Manrope"],
                        "headline-lg-mobile": ["Manrope"],
                        "headline-lg": ["Manrope"],
                        "title-md": ["Manrope"],
                        "label-sm": ["Manrope"],
                        "display": ["Manrope"],
                        "body-lg": ["Manrope"]
                    },
                    "fontSize": {
                        "body-md": ["16px", {
                            "lineHeight": "24px",
                            "fontWeight": "400"
                        }],
                        "label-md": ["14px", {
                            "lineHeight": "20px",
                            "letterSpacing": "0.01em",
                            "fontWeight": "600"
                        }],
                        "headline-lg-mobile": ["24px", {
                            "lineHeight": "32px",
                            "fontWeight": "700"
                        }],
                        "headline-lg": ["32px", {
                            "lineHeight": "40px",
                            "letterSpacing": "-0.01em",
                            "fontWeight": "700"
                        }],
                        "title-md": ["20px", {
                            "lineHeight": "28px",
                            "fontWeight": "600"
                        }],
                        "label-sm": ["12px", {
                            "lineHeight": "16px",
                            "letterSpacing": "0.03em",
                            "fontWeight": "700"
                        }],
                        "display": ["40px", {
                            "lineHeight": "48px",
                            "letterSpacing": "-0.02em",
                            "fontWeight": "800"
                        }],
                        "body-lg": ["18px", {
                            "lineHeight": "28px",
                            "fontWeight": "400"
                        }]
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-background font-body-md text-on-background">
    <header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.04)]">
        <div class="h-16 px-margin-mobile flex items-center gap-md"><button class="w-11 h-11 -ml-2 flex items-center justify-center rounded-full active:bg-surface-container" onclick="history.back()"><span class="material-symbols-outlined text-on-surface">arrow_back</span></button>
            <h1 class="font-title-md text-title-md text-on-surface">Report Waste</h1>
        </div>
    </header>
    <main class="relative w-full pt-16 bg-background min-h-screen">
        <div class="flex flex-col w-full h-full relative overflow-hidden bg-background">
            <!-- Progress Bar & Header area (inline layout integration) -->
            <div class="px-margin-mobile pb-md pt-xs flex flex-col gap-xs z-10 relative">
                <div class="flex items-center justify-between">
                    <span class="font-label-sm text-tertiary">Step 1 of 3</span>
                    <div class="flex items-center gap-1">
                        <div class="w-8 h-1 bg-primary rounded-full"></div>
                        <div class="w-8 h-1 bg-surface-variant rounded-full"></div>
                        <div class="w-8 h-1 bg-surface-variant rounded-full"></div>
                    </div>
                </div>
                <div class="flex flex-col gap-1">
                    <h2 class="font-headline-lg-mobile text-on-background">Capture the Waste</h2>
                    <p class="font-body-md text-on-surface-variant">Keep the complete waste area visible.</p>
                </div>
            </div>
            <!-- Camera Viewfinder Area -->
            <div class="relative flex-1 mx-margin-mobile mb-4 mt-2 rounded-2xl overflow-hidden bg-surface-container-highest shadow-sm isolate">
                <!-- Camera Feed Placeholder -->
                <img class="absolute inset-0 w-full h-full object-cover z-0" data-alt="First-person view through a smartphone camera viewfinder. An illegal dumping site on a suburban street corner. Several black trash bags, a discarded cardboard box, and a broken plastic chair are scattered on the grass verge next to the pavement. The lighting is overcast daylight. The focus is slightly on the center of the pile. The style is realistic smartphone photography, slightly raw and unedited, civic reporting style."
                    src="https://lh3.googleusercontent.com/aida-public/AB6AXuB607F_KAIetW5PlrTarTeu8vfB_hRc_UWJ-kqKbp7WI0OgaqZ5seFad83cXzeNBV3mOt8zTlA57IeZbLw-bPbM2JP8avHQi5ZIxyswq6LGVftf0rD_m_AjWStT7dz16XNdRZ1L1WO3Vpz97rU87BeUy-_UQiRt-YNuHrN4ugwdUwsnQAsF92J7M-EPiSPWhjreXUrssxYzQ1aLiA_U2CRnnau8uqxtpGfZyji_wcLbC-1CsA8Pj2AJ"
                />
                <!-- AI Targeting Reticle -->
                <div class="absolute inset-0 z-10 pointer-events-none flex items-center justify-center">
                    <!-- Center Reticle -->
                    <div class="relative w-48 h-48">
                        <div class="absolute top-0 left-0 w-8 h-8 rounded-tl-xl border-t-4 border-l-4 border-[#06B6D4] opacity-80 shadow-[0_0_8px_rgba(6,182,212,0.6)]"></div>
                        <div class="absolute top-0 right-0 w-8 h-8 rounded-tr-xl border-t-4 border-r-4 border-[#06B6D4] opacity-80 shadow-[0_0_8px_rgba(6,182,212,0.6)]"></div>
                        <div class="absolute bottom-0 left-0 w-8 h-8 rounded-bl-xl border-b-4 border-l-4 border-[#06B6D4] opacity-80 shadow-[0_0_8px_rgba(6,182,212,0.6)]"></div>
                        <div class="absolute bottom-0 right-0 w-8 h-8 rounded-br-xl border-b-4 border-r-4 border-[#06B6D4] opacity-80 shadow-[0_0_8px_rgba(6,182,212,0.6)]"></div>
                        <!-- Scanning Line Animation -->
                        <div class="absolute top-0 left-0 w-full h-[2px] bg-gradient-to-r from-transparent via-[#06B6D4] to-transparent scan-line"></div>
                    </div>
                </div>
                <!-- Top Overlays: Status Indicators -->
                <div class="absolute top-4 left-4 right-4 z-20 flex justify-between items-start pointer-events-none">
                    <div class="flex items-center gap-2 bg-surface/90 backdrop-blur-md px-3 py-1.5 rounded-full shadow-sm">
                        <span class="material-symbols-outlined text-[16px] text-primary" style="font-variation-settings: 'FILL' 1;">location_on</span>
                        <span class="font-label-sm text-on-surface">Location detected</span>
                    </div>
                    <!-- Live AI analysis pills -->
                    <div class="flex flex-col gap-2 items-end">
                        <div class="flex items-center gap-1.5 bg-surface/90 backdrop-blur-md px-2.5 py-1 rounded-full shadow-sm">
                            <span class="w-1.5 h-1.5 rounded-full bg-primary animate-pulse"></span>
                            <span class="font-label-sm text-on-surface">Blur: Optimal</span>
                        </div>
                        <div class="flex items-center gap-1.5 bg-surface/90 backdrop-blur-md px-2.5 py-1 rounded-full shadow-sm">
                            <span class="w-1.5 h-1.5 rounded-full bg-primary animate-pulse" style="animation-delay: 300ms;"></span>
                            <span class="font-label-sm text-on-surface">Light: Good</span>
                        </div>
                    </div>
                </div>
                <!-- Bottom Helper Tooltip -->
                <div class="absolute bottom-4 left-4 right-4 z-20 flex justify-center pointer-events-none">
                    <div class="bg-inverse-surface/95 backdrop-blur text-inverse-on-surface px-4 py-3 rounded-xl shadow-md flex items-start gap-3 max-w-sm">
                        <span class="material-symbols-outlined text-[20px] text-secondary-container mt-0.5" style="font-variation-settings: 'FILL' 1;">tips_and_updates</span>
                        <p class="font-label-sm leading-relaxed">Helper: Include nearby objects (like a bench or car) to help AI estimate size.</p>
                    </div>
                </div>
                <style>
                    @keyframes scan {
                        0% {
                            top: 0%;
                            opacity: 0;
                        }
                        10% {
                            opacity: 1;
                        }
                        90% {
                            opacity: 1;
                        }
                        100% {
                            top: 100%;
                            opacity: 0;
                        }
                    }
                    
                    .scan-line {
                        animation: scan 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
                    }
                </style>
            </div>
            <!-- Bottom Controls Area -->
            <div class="bg-surface pb-safe z-20 relative shadow-[0_-4px_16px_-4px_rgba(0,0,0,0.05)] rounded-t-3xl">
                <!-- Capture Mode Tabs -->
                <div class="flex justify-center pt-4 pb-2">
                    <div class="flex bg-surface-container rounded-full p-1">
                        <button class="px-6 py-1.5 rounded-full bg-surface shadow-sm font-label-md text-on-surface transition-all">Photo</button>
                        <button class="px-6 py-1.5 rounded-full font-label-md text-on-surface-variant transition-all hover:bg-surface-container-high">Video</button>
                    </div>
                </div>
                <!-- Action Buttons -->
                <div class="flex items-center justify-between px-margin-mobile py-4 pb-8">
                    <!-- Gallery Button -->
                    <button class="w-12 h-12 flex items-center justify-center rounded-full bg-surface-container-high hover:bg-surface-container-highest transition-colors active:scale-95 shadow-sm">
<span class="material-symbols-outlined text-on-surface-variant" style="font-variation-settings: 'FILL' 1;">photo_library</span>
</button>
                    <!-- Shutter Button -->
                    <button class="relative w-20 h-20 flex items-center justify-center rounded-full group active:scale-95 transition-transform" id="shutter-btn">
<!-- Outer Ring -->
<div class="absolute inset-0 rounded-full border-4 border-surface-container-highest"></div>
<!-- Inner Button (Gradient for AI connection) -->
<div class="w-[68px] h-[68px] rounded-full bg-gradient-to-br from-primary to-[#06B6D4] shadow-[0_4px_12px_rgba(0,107,44,0.3)] group-hover:scale-105 transition-transform duration-200"></div>
</button>
                    <!-- Flash Toggle / Secondary Tool -->
                    <button class="w-12 h-12 flex items-center justify-center rounded-full bg-surface-container-high hover:bg-surface-container-highest transition-colors active:scale-95 shadow-sm">
<span class="material-symbols-outlined text-on-surface-variant" style="font-variation-settings: 'FILL' 0;">flash_off</span>
</button>
                </div>
            </div>
            <script>
                // Add subtle haptic feedback simulation and visual flourish to shutter button
                const shutterBtn = document.getElementById('shutter-btn');
                shutterBtn.addEventListener('click', function(e) {
                    // Visual flash
                    const flash = document.createElement('div');
                    flash.className = 'absolute inset-0 bg-white z-50 pointer-events-none transition-opacity duration-300 opacity-100';
                    document.querySelector('.isolate').appendChild(flash);

                    // Force reflow
                    void flash.offsetWidth;

                    flash.style.opacity = '0';
                    setTimeout(() => flash.remove(), 300);

                    // Simulate native haptic if available
                    if (navigator.vibrate) {
                        navigator.vibrate(50);
                    }
                });
            </script>
        </div>
    </main>
</body>

</html>
