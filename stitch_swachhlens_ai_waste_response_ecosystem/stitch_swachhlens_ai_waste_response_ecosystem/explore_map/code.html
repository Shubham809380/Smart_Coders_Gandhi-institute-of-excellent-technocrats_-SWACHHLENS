<script>
    // Bottom Sheet Logic
    const bottomSheet = document.getElementById('bottomSheet');
    let isSheetOpen = false;

    function openBottomSheet() {
        bottomSheet.classList.remove('translate-y-full');
        isSheetOpen = true;
    }

    function closeBottomSheet() {
        bottomSheet.classList.add('translate-y-full');
        isSheetOpen = false;
    }

    // Hotspot Toggle Logic
    const hotspotToggle = document.getElementById('hotspotToggle');
    const hotspotBg = document.getElementById('hotspotBg');
    const hotspotIcon = hotspotToggle.querySelector('.material-symbols-outlined');
    let isHotspotActive = false;

    hotspotToggle.addEventListener('click', () => {
        isHotspotActive = !isHotspotActive;
        if(isHotspotActive) {
            hotspotBg.classList.remove('opacity-0');
            hotspotIcon.classList.add('text-error');
            hotspotIcon.classList.remove('text-on-surface-variant');
            hotspotIcon.style.fontVariationSettings = "'FILL' 1";
            // In a real app, this would trigger a map layer update
        } else {
            hotspotBg.classList.add('opacity-0');
            hotspotIcon.classList.remove('text-error');
            hotspotIcon.classList.add('text-on-surface-variant');
            hotspotIcon.style.fontVariationSettings = "'FILL' 0";
        }
    });

    // Simple swipe down to close
    let touchStartY = 0;
    bottomSheet.addEventListener('touchstart', e => {
        touchStartY = e.changedTouches[0].screenY;
    }, {passive: true});
    
    bottomSheet.addEventListener('touchend', e => {
        const touchEndY = e.changedTouches[0].screenY;
        if (touchEndY > touchStartY + 50) {
            closeBottomSheet();
        }
    }, {passive: true});
