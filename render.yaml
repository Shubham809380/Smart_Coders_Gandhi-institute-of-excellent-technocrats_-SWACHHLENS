# Realtime service only.
# Frontend + AI/API stay on Vercel (serverless); Socket.IO lives here because
# it needs a persistent connection, which serverless platforms cannot provide.
services:
  - type: web
    name: swachhlens-socket
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install
    startCommand: npm run start:socket
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Comma-separated list of allowed browser origins (no trailing slash).
      - key: FRONTEND_URL
        sync: false
      # Shared secret with the Vercel API for the /internal/emit event bridge.
      - key: INTERNAL_API_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
